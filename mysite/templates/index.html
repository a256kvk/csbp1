<p>WELCOME</p>
{% if user.is_authenticated %}
{{ user.username }}
<form action="accounts/logout/" method="POST">
	{% csrf_token %}
	<button type="submit">Log out</button>
</form>
<a href="/create/">Create a post</a>
{% else %}
<a href="/accounts/login">Log in</a>
{% endif %}

{% for p in posts %}
<article>
	<h2>Post by {{p.account}}</h2>
	<p>{{p.content}}</p>
</article>
{% endfor %}
