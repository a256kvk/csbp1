{% extends "layout.html" %}
{% block title %}Create a post{% endblock %}

{% block content %}

<h1>Private notes</h1>
{% if user.is_authenticated %}

<form method="POST">
	<!--
	{% csrf_token %}
	-->
	<textarea name="content">{{ notes }}</textarea><br>
	<button type="submit">Save</button>
</form>

{% else %}

<p><a href="/accounts/login">Log in</a>to see your private notes</p>

{% endif %}
{% endblock %}
